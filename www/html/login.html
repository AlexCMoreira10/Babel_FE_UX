<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Estante</title>
  <link rel="stylesheet" href="../css/Main.css">
  <script type="module" src="https://unpkg.com/@ionic/core@latest/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://unpkg.com/@ionic/core@latest/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@ionic/core@latest/css/ionic.bundle.css">
  <script type="importmap">
    {
      "imports": {
        "@capacitor/core": "https://esm.sh/@capacitor/core@8.5.2"
      }
    }
  </script>
</head>
<body>
<ion-app>
  <ion-content fullscreen>
    <header class="navbar">
      <div class="logo">
        <ion-icon name="book-outline"></ion-icon>
        <span>Estante</span>
      </div>
      <a href="../index.html" class="btn-secondary">Voltar</a>
    </header>

    <main class="login-page">
      <section class="login-card">
        <div class="login-head">
          <span>Entrar</span>
          <h1>Acesse sua estante.</h1>
          <p>Entre com seu e-mail e senha ou continue com sua conta Google.</p>
        </div>

        <form id="emailLoginForm" class="auth-form">
          <div class="form-group">
            <label for="loginEmail">E-mail</label>
            <input id="loginEmail" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Senha</label>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p id="loginFeedback" class="auth-feedback" role="status" aria-live="polite"></p>
          <button id="emailLoginBtn" class="btn-add auth-submit" type="submit">Entrar com e-mail</button>
        </form>

        <div class="auth-divider"><span>ou</span></div>
        <button id="loginBtn" class="btn-secondary auth-google" type="button">
          <ion-icon name="logo-google"></ion-icon>
          Entrar com Google
        </button>
        <p class="auth-switch">Ainda não tem conta? <a href="./cadastro.html">Cadastre-se</a></p>
      </section>
    </main>
  </ion-content>
</ion-app>
<script type="module" src="../js/login.js"></script>
</body>
</html>
